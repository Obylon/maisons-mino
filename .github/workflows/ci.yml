name: CI Maisons MINO

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mino-backend
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compiler le backend
        run: mvn -B clean compile

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mino-frontend
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer les dependances
        run: npm install
      - name: Build du frontend
        run: npm run build
