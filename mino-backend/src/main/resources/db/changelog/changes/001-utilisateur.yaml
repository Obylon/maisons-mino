databaseChangeLog:
  - changeSet:
      id: 1
      author: t.fontep
      changes:
        - createTable:
            tableName: utilisateur
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_utilisateur
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_utilisateur_email
              - column:
                  name: mot_de_passe_hash
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: nom
                  type: varchar(255)
              - column:
                  name: prenom
                  type: varchar(255)
              - column:
                  name: telephone
                  type: varchar(50)
              - column:
                  name: date_creation_compte
                  type: timestamp
                  defaultValueComputed: now()
                  constraints:
                    nullable: false
              - column:
                  name: actif
                  type: boolean
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
