databaseChangeLog:
  - changeSet:
      id: 1
      author: t.fontep
      changes:
        - createTable:
            tableName: groupe
            columns:
              - column:
                  name: id
                  type: varchar(36)
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_groupe
                    nullable: false
              - column:
                  name: cohorte_id
                  type: varchar(36)
                  constraints:
                    nullable: false
                    foreignKeyName: fk_groupe_cohorte
                    references: cohorte(id)
              - column:
                  name: date_constitution
                  type: date
