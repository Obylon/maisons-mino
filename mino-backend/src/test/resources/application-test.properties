spring.datasource.url=jdbc:h2:mem:mino_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# "none" plutot que "validate" : H2 a des divergences de type mineures avec
# PostgreSQL (TEXT devient CLOB sur H2, par exemple) qui font echouer la
# validation stricte d'Hibernate alors que le schema est en realite correct
# (garanti par Liquibase, qui vient de tourner juste avant). En production,
# sur le vrai PostgreSQL, ddl-auto reste "validate" - ce changement ne
# concerne que l'environnement de test H2.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.contexts=aucun-contexte-de-test

mino.jwt.secret=test-secret-key-not-for-production-use-only-in-tests
mino.jwt.expiration-ms=3600000

spring.mail.host=localhost
spring.mail.port=1025
mino.email.expediteur=test@test.fr